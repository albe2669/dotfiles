modelRoles: 
  default: corti/corti-s1
  smol: corti/corti-s1-mini
  slow: corti/corti-s1
  plan: corti/corti-s1
  task: corti/corti-s1
  commit: corti/corti-s1-mini-instant
  tiny: corti/corti-s1-mini-instant
  advisor: corti/corti-s1
  vision: corti/corti-s1-mini
tools: 
  approvalMode: yolo
  approval: 
    bash: allow
lsp: 
  enabled: true
  lazy: true
  diagnosticsOnWrite: true
  formatOnWrite: true
  diagnosticsOnEdit: true
bash: 
  enabled: true
  direnv: auto
ask: 
  notify: "on"
theme: 
  dark: everforest
symbolPreset: nerd
statusLine: 
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: true
defaultThinkingLevel: auto
compaction: 
  enabled: true
  strategy: context-full
  autoContinue: true
  thresholdTokens: -1
  thresholdPercent: 80
eval: 
  py: true
  js: true
memory: 
  backend: mnemopi
power: 
  sleepPrevention: idle
github: 
  enabled: true
providers: 
  tinyModel: online
  memoryModel: online
disabledProviders: 
  - github
setupVersion: 1
hideThinkingBlock: false
advisor: 
  enabled: false
python: 
  kernelMode: session
inspect_image: 
  mode: auto
task: 
  eager: preferred
  enableEffort: true
  maxEffort: max
error: 
  notify: "on"
startup: 
  checkUpdate: false
features: 
  unexpectedStopDetection: true
mnemopi: 
  llmMode: smol
  embeddingModel: ""