modelRoles:
  default: corti/corti-s1
  smol: corti/corti-s1-mini
  slow: corti/corti-s1
  plan: corti/corti-s1
  task: corti/corti-s1
  commit: corti/corti-s1-mini-instant
  tiny: corti/corti-s1-mini-instant
tools:
  approvalMode: yolo
  approval:
    bash: allow
lsp:
  enabled: true
  lazy: true
  diagnosticsOnWrite: true
  formatOnWrite: true
bash:
  enabled: true
ask:
  notify: "on"
theme:
  dark: everforest
symbolPreset: nerd
statusLine:
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: true
defaultThinkingLevel: auto
compaction:
  enabled: true
  strategy: context-full
  autoContinue: true
eval:
  py: true
  js: true
memory:
  backend: mnemopi
power:
  sleepPrevention: idle
github:
  enabled: true
providers:
  tinyModel: online
disabledProviders:
  - github
setupVersion: 1
hideThinkingBlock: false

